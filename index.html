<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F6BFF">
<title>Culture Corner — brot2you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F9FF;--ink:#1B2A4A;--soft:#5B6B8C;--line:#DCE7F5;--brand:#2F6BFF;--brand2:#1E4FD8;--pop:#FF4D6D;--sun:#FFC233;--mint:#22B573;--card:#FFFFFF;
--music:#FF4D8D;--film:#FF6A3D;--series:#22B573;--podcast:#8B5CF6;--press:#0EA5C6;--art:#F59E0B}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body.dys{font-family:Verdana,Tahoma,sans-serif;letter-spacing:.03em;word-spacing:.1em}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand2)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.flag{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-style:normal;line-height:1}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font:700 24px Fredoka,sans-serif;color:var(--ink)}
.logo .globe{font-size:28px;display:inline-block}
.logo b{color:var(--pop);font-weight:700}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{border:0;background:none;padding:9px 13px;border-radius:12px;font-weight:800;color:var(--soft)}
.nav button:hover{background:#EEF4FF;color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff}
.nav .count{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--pop);color:#fff;font-size:12px;margin-left:4px}
.modeswitch{display:flex;background:#EEF4FF;border-radius:14px;padding:3px}
.modeswitch button{border:0;background:none;padding:7px 12px;border-radius:11px;font-weight:800;font-size:14px;color:var(--soft)}
.modeswitch button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(27,42,74,.15)}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2F6BFF 0%,#5B8CFF 45%,#7FD3FF 100%);color:#fff;border-radius:0 0 36px 36px;padding:46px 0 56px}
.hero h1{font-size:clamp(38px,6vw,68px);font-weight:700;letter-spacing:.5px;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.hero h1 .c2{color:var(--sun)}
.hero p.lead{font-size:clamp(17px,2vw,20px);max-width:620px;margin:14px 0 24px;opacity:.95}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.hero .float{position:absolute;right:-20px;top:20px;width:min(46%,520px);height:100%;pointer-events:none}
.pc-mini{position:absolute;background:#fff;color:var(--ink);border-radius:14px;padding:10px 12px 12px;box-shadow:0 14px 30px rgba(10,30,90,.28);width:170px;font:700 14px Fredoka,sans-serif}
.pc-mini .bd{height:54px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:8px}
.pc-mini .fl{position:absolute;top:-10px;right:-10px;font-size:26px;background:#fff;border-radius:8px;padding:2px 4px;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:16px;padding:14px 22px;font:700 17px Fredoka,sans-serif;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn-sun{background:var(--sun);color:#3A2600;box-shadow:0 5px 0 #D99A00}
.btn-white{background:#fff;color:var(--brand2);box-shadow:0 5px 0 #BFD2FF}
.btn-ink{background:var(--ink);color:#fff;box-shadow:0 5px 0 #0B1630}
.btn-pop{background:var(--pop);color:#fff;box-shadow:0 5px 0 #C9284A}
.btn-ghost{background:#EEF4FF;color:var(--brand2);box-shadow:none}
.btn-sm{padding:9px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* sections */
.sec{margin:38px 0}
.sec h2{font-size:clamp(24px,3vw,32px);margin-bottom:6px}
.sec .sub{color:var(--soft);margin:0 0 16px}
.grid-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.dest{position:relative;border:0;background:var(--card);border-radius:20px;padding:18px 12px 14px;text-align:center;box-shadow:0 6px 0 var(--line),0 10px 24px rgba(27,42,74,.06);transition:transform .15s}
.dest:hover{transform:translateY(-4px) rotate(-1deg)}
.dest .flag{font-size:46px;display:block;margin-bottom:6px}
.dest b{display:block;font:600 17px Fredoka,sans-serif}
.dest small{color:var(--soft);font-weight:700}
.dest .prog{height:6px;background:#EEF2F8;border-radius:6px;margin-top:8px;overflow:hidden}
.dest .prog span{display:block;height:100%;background:var(--mint)}
.grid-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.mood{border:0;border-radius:22px;padding:20px 16px;color:#fff;text-align:left;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .15s}
.mood:hover{transform:translateY(-4px)}
.mood .ic{font-size:40px;line-height:1}
.mood b{font:700 21px Fredoka,sans-serif}
.mood small{opacity:.9;font-weight:700}
/* pick of the day */
.daily{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--card);border-radius:26px;padding:22px;box-shadow:0 8px 0 var(--line),0 14px 30px rgba(27,42,74,.07);border:3px dashed #FFD666}
.daily .big{width:150px;height:150px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:68px;position:relative}
.daily .big .flag{position:absolute;bottom:-12px;right:-12px;font-size:40px;background:#fff;border-radius:12px;padding:3px 5px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.daily h3{font-size:clamp(22px,2.6vw,28px);margin:6px 0}
.ribbon{display:inline-block;background:var(--sun);color:#3A2600;font:700 13px Fredoka,sans-serif;padding:4px 12px;border-radius:20px}
/* passport strip */
.pstrip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#1B2A4A,#2E3F6E);color:#fff;border-radius:22px;padding:18px 22px}
.pstrip .stamps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pstrip .st{font-size:26px;filter:grayscale(1) opacity(.35)}
.pstrip .st.on{filter:none}
/* explore */
.filters{position:sticky;top:64px;z-index:30;background:rgba(242,249,255,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:10px;align-items:center}
.search input{flex:1;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 16px;font-size:17px;outline:none}
.search input:focus{border-color:var(--brand)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font-weight:800;font-size:14px;color:var(--soft);white-space:nowrap}
.chip:hover{border-color:#B9CCEA;color:var(--ink)}
.chip.on{color:#fff;border-color:transparent}
.chip .flag{font-size:17px;vertical-align:-2px}
.selrow{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.selrow select{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;font-weight:700;font-size:14px;max-width:100%}
.selrow select.on{border-color:var(--brand);color:var(--brand2)}
.resbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.resbar b{font:600 20px Fredoka,sans-serif}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;text-align:left;border:0;background:var(--card);border-radius:20px;padding:0;overflow:hidden;box-shadow:0 6px 0 var(--line),0 10px 22px rgba(27,42,74,.06);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--line),0 18px 30px rgba(27,42,74,.1)}
.card .band{height:86px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#fff;position:relative}
.card .band .ic{font-size:36px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.card .band .lab{font:700 15px Fredoka,sans-serif;text-transform:none}
.stamp{position:absolute;right:14px;bottom:-20px;width:50px;height:54px;background:#fff;border:3px dashed #C9D6EA;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.18);transform:rotate(5deg)}
.card .body{padding:16px 16px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:18px;padding-right:48px}
.card p{margin:0;color:var(--soft);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:800;background:#EEF2F8;color:var(--soft)}
.pill.lv1{background:#DFF7E8;color:#14753F}.pill.lv2{background:#E3F4FF;color:#0B5E8E}.pill.lv3{background:#FFF1D6;color:#8A5A00}.pill.lv4{background:#FFE4DA;color:#A33A12}.pill.lv5{background:#FFE0E8;color:#A3163C}
.pill.done{background:var(--mint);color:#fff}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
.heart.on{background:#fff}
.more{display:flex;justify-content:center;margin:26px 0}
.empty{text-align:center;padding:50px 20px;background:#fff;border-radius:22px;border:3px dashed var(--line)}
.empty .big{font-size:52px}
/* teacher list */
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--line);border-left:6px solid var(--line)}
.trow:hover{background:#FAFCFF}
.trow .ic{font-size:24px;width:30px;text-align:center}
.trow .tt{flex:1;min-width:0}
.trow .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tt small{color:var(--soft);font-weight:700}
.viewtog{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;padding:2px}
.viewtog button{border:0;background:none;padding:6px 10px;border-radius:9px;font-weight:800;font-size:13px;color:var(--soft)}
.viewtog button.on{background:var(--ink);color:#fff}
/* modal */
.mback{position:fixed;inset:0;background:rgba(15,25,50,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:760px){.mback{align-items:center;padding:24px}}
.modal{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .25s ease-out}
@media(min-width:760px){.modal{border-radius:26px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mhead{position:relative;padding:26px 24px 34px;color:#fff}
.mhead .ic{font-size:44px}
.mhead h2{font-size:clamp(23px,3.2vw,31px);margin:8px 50px 6px 0}
.mhead .close{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:22px}
.mhead .stamp{right:24px;bottom:-26px;width:64px;height:68px;font-size:38px}
.mbody{padding:28px 24px 26px}
.mbody p.desc{font-size:17px;margin:0 0 14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.tags span{background:#F2F5FA;color:var(--soft);border-radius:10px;padding:3px 9px;font-size:13px;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.note{background:#FFF8E1;border-radius:14px;padding:12px 14px;font-size:14.5px;color:#6B4E00;margin:10px 0}
.box{border-radius:18px;padding:18px;margin:18px 0;background:#F5F8FF}
.box h3{font-size:20px;margin-bottom:8px}
.box ol,.box ul{margin:6px 0 0;padding-left:22px}
.box li{margin:6px 0}
.related{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rel{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:#F5F8FF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px}
.rel .ic{font-size:24px}
.rel:hover{background:#EAF1FF}
.fiche h4{font:600 16px Fredoka,sans-serif;margin:14px 0 4px;color:var(--brand2)}
.fiche p,.fiche li{font-size:14.5px;margin:4px 0}
.lex{display:flex;gap:6px;flex-wrap:wrap}
.lex span{background:#E8F0FF;color:var(--brand2);border-radius:10px;padding:3px 10px;font-weight:800;font-size:13px}
/* passport */
.passport{background:linear-gradient(150deg,#1B2A4A,#34477C);color:#fff;border-radius:28px;padding:26px;box-shadow:0 10px 0 #0E1730}
.passport h2{font-size:clamp(26px,3.4vw,36px)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:18px}
.pst{color:#fff;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.3);border-radius:18px;padding:14px 8px;text-align:center}
.pst .flag{font-size:40px;display:block;filter:grayscale(1) opacity(.35)}
.pst.on{background:#fff;color:var(--ink);border:2px solid var(--sun);transform:rotate(-2deg)}
.pst.on .flag{filter:none}
.pst b{display:block;font:600 15px Fredoka,sans-serif;margin-top:6px}
.pst small{font-weight:800;opacity:.75}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 16px}
.stat b{display:block;font:700 26px Fredoka,sans-serif;color:var(--sun)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.badge{background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:0 5px 0 var(--line)}
.badge .ic{font-size:40px;display:block}
.badge b{display:block;font:600 16px Fredoka,sans-serif;margin:6px 0 2px}
.badge small{color:var(--soft);font-weight:700}
.badge.off{opacity:.5;filter:grayscale(1)}
.badge .bar{height:6px;background:#EEF2F8;border-radius:6px;margin-top:8px;overflow:hidden}
.badge .bar span{display:block;height:100%;background:var(--sun)}
/* forms */
.form label{display:block;font-weight:800;font-size:14px;margin:12px 0 5px}
.form input,.form select,.form textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.form textarea{min-height:90px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#C9284A;font-weight:800}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:16px;font-weight:800;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.toast.hidden{display:none}
.stampfx{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stampfx div{background:#fff;border:6px solid var(--pop);color:var(--pop);border-radius:20px;padding:18px 26px;font:700 28px Fredoka,sans-serif;transform:rotate(-8deg);box-shadow:0 20px 50px rgba(0,0,0,.3);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.stampfx .flag{font-size:56px;display:block;text-align:center}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.footer{text-align:center;color:var(--soft);font-size:14px;padding:40px 18px 50px}
#printArea{display:none}
.nav .ni{margin-right:5px}
@media(max-width:760px){.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}.top .wrap{flex-wrap:nowrap}.modeswitch{margin-left:auto}.modeswitch button{padding:6px 9px;font-size:13px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(27,42,74,.08);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:11.5px;border-radius:12px}.nav .ni{font-size:22px;margin:0}.nav button.on{background:#EEF4FF;color:var(--ink)}.nav .count{position:relative;top:-1px}body{padding-bottom:76px}.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
@media(max-width:760px){.daily{grid-template-columns:1fr;text-align:left}.daily .big{width:100%;height:120px}.hero .float{display:none}.logo{font-size:20px}.filters{top:64px}.form .two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff}body>*{display:none!important}#printArea{display:block!important;font:11pt/1.5 Georgia,serif;color:#000}#printArea h1{font-size:18pt;margin:0 0 6pt}#printArea h2{font-size:13pt;margin:12pt 0 4pt}#printArea .pi{border-bottom:1px solid #ccc;padding:6pt 0}#printArea a{color:#000}}
</style>
</head>

<header class="top"><div class="wrap" id="topbar"></div></header>
<main id="app"></main>

","c":"🇬🇧","y":2023,"u":"https://www.bbc.co.uk/arts/articles/street-art-city-writing","d":"Le graffiti et le street art comme formes d'écriture urbaine. Langage visuel dans l'espace public, des origines du hip-hop à Banksy.","tg":["street art","writing","urban","language"],"df":"A2-B1","g":1},{"i":1287,"t":"Columbus Day vs Juneteenth — Two American Stories","ty":"press","ax":"Des langues, des lieux, des histoires","lv":"Collège","c":"🇺🇸","y":2023,"u":"https://www.bbc.co.uk/news/world-us-canada-57626555","d":"Columbus Day et Juneteenth racontant deux histoires différentes de l'Amérique. Langue, mémoire et réécriture de l'histoire.","tg":["Juneteenth","Columbus","USA","history"],"df":"A2-B1","g":1}],"tpl":{"OBJ_VERBS":{"A1":{"comm":"vérifier une hypothèse à partir d'indices très simples (image, mots isolés)","prod":"produire des phrases courtes en réutilisant le lexique relevé"},"A2":{"comm":"confirmer ou ajuster une anticipation à l'aide d'une stratégie de repérage ciblé","prod":"décrire en s'appuyant sur des mots-clés identifiés en amont"},"B1":{"comm":"structurer sa compréhension grâce à une grille de repérage active","prod":"réinvestir à l'oral le lexique et les connecteurs travaillés"},"B2":{"comm":"distinguer les informations explicites des intentions implicites","prod":"argumenter en s'appuyant sur des éléments précis du document"},"C1":{"comm":"interpréter des nuances et des choix d'énonciation","prod":"produire une analyse personnelle étayée par le document"}},"TYPE_TEMPLATES":{"film":{"amorce":"Couper le son et montrer 30 secondes d'image seule. Les élèves formulent des hypothèses sur la situation (lieu, relation entre les personnages, enjeu) à l'aide d'amorces : 'I think... because I can see...'. Lister les hypothèses au tableau sans les valider.","exploitation":"Visionnage avec le son, en deux temps. 1er visionnage : les élèves cochent sur leurs hypothèses celles confirmées ou infirmées (stratégie de vérification active, pas de prise de notes exhaustive). 2e visionnage ciblé sur un passage clé : repérage des marqueurs non-verbaux (ton, regard, silence) qui construisent le sens au-delà des mots.","production":"Par deux, les élèves reconstituent oralement la scène du point de vue d'un personnage absent du dialogue (qu'a-t-il pu observer/ressentir ?). Réinvestissement du lexique relevé en étape 2.","questionsTpl":["Before watching: What can you predict from the image alone, and why?","After the 1st viewing: Which of your hypotheses were right? What surprised you?","Look at [character]'s face/silence at [moment]. What does it tell us that the words don't?"]},"series":{"amorce":"Donner uniquement le titre de l'épisode et un mot-clé du genre (mystery, sitcom, drama). Les élèves anticipent par écrit en 2 phrases ce que le mot-clé leur fait attendre comme type de scène.","exploitation":"Visionnage de l'extrait avec une grille à 2 colonnes : 'Ce qui confirme mon attente' / 'Ce qui me surprend'. Pause juste avant un moment de bascule narrative : les élèves formulent par écrit une prédiction précise et justifiée (pas un simple oui/non) avant de voir la suite.","production":"Comparaison en groupe des prédictions : qui était le plus proche et pourquoi ? Rédaction collective d'une règle du genre ('In this type of show, characters usually...') à partir des observations.","questionsTpl":["Write 2 sentences: what does the keyword '[genre]' make you expect?","Pause point: predict precisely what happens next, and justify with one clue from the scene.","Which detail in the dialogue or setting first made you revise your prediction?"]},"music":{"amorce":"Écoute de la musique seule (sans paroles visibles), volume bas. Les élèves notent 3 adjectifs pour décrire l'ambiance avant de connaître le sujet du morceau.","exploitation":"Distribution des paroles avec des mots-clés effacés (les plus porteurs de sens, pas au hasard). Les élèves doivent les retrouver à l'oreille en s'appuyant sur la rime et le rythme — stratégie d'anticipation phonologique, pas de la dictée. Repérage ensuite des répétitions et de leur effet (insistance, refrain, montée émotionnelle).","production":"Les élèves choisissent UNE ligne du texte et expliquent à l'oral pourquoi elle est, selon eux, la plus forte du morceau, en utilisant au moins 2 mots relevés à l'étape précédente.","questionsTpl":["Before the lyrics: what 3 adjectives describe the mood of the music alone?","Use rhyme and rhythm to guess the missing word in line [X] before checking.","Which repeated word or phrase carries the most weight in the song? Why that one?"]},"podcast":{"amorce":"Annoncer uniquement le sujet en 3 mots. Les élèves listent par deux tout le vocabulaire qu'ils pensent pouvoir entendre (activation lexicale anticipée, à valider ensuite à l'écoute).","exploitation":"1re écoute, livre fermé : les élèves cochent sur leur liste les mots réellement entendus (vérification active de leur lexique anticipé). 2e écoute avec grille ciblée sur la structure de l'argumentation : combien d'arguments, quel exemple pour chacun — pas un résumé global, mais un repérage de la structure du discours.","production":"Par groupe de 3, restitution orale où chacun reformule un argument entendu en l'introduisant par un connecteur différent (firstly / in addition / however) — réinvestissement explicite des connecteurs logiques.","questionsTpl":["Before listening: list 5 words you expect to hear about [topic].","1st listen: which of your words did you actually hear? Which surprised you?","Map the structure: how many arguments, and what example supports each one?"]},"press":{"amorce":"Montrer uniquement le titre et la photo, texte caché. Les élèves formulent par écrit la question à laquelle l'article va, selon eux, répondre.","exploitation":"Lecture en temps limité (90 secondes) pour repérer uniquement : qui, où, quand (stratégie de balayage ciblé, pas une lecture linéaire complète). Comparaison avec la question anticipée. Puis lecture approfondie d'un seul paragraphe choisi pour en extraire l'argument principal et UN exemple qui l'illustre.","production":"Rédaction d'une légende alternative pour la photo, qui doit résumer l'angle de l'article en une phrase — exercice de synthèse contrainte, pas un résumé libre.","questionsTpl":["From the title and photo alone, what question do you expect this article to answer?","90-second scan: who, where, when? Did the article answer your question?","In the paragraph you chose, what is the argument and what example supports it?"]},"art":{"amorce":"Observation de 30 secondes en silence total, sans prise de notes. Puis, les yeux fermés, chaque élève dit à voix haute UN seul élément dont il se souvient (mémoire sélective = ce qui frappe vraiment).","exploitation":"Deuxième observation, cette fois avec une consigne de balayage organisé : premier plan → arrière-plan → détails. Les élèves notent un mot par zone (pas une description complète) pour structurer leur regard analytique avant l'interprétation.","production":"Mise en commun : à partir des mots collectés en étape 2, formuler ensemble une hypothèse sur l'intention de l'auteur, puis la confronter à un élément de contexte donné par le professeur (rédaction de l'œuvre, époque).","questionsTpl":["After 30 seconds: what is the ONE thing you remember most? Why that detail?","Scan foreground, background, details — one word for each zone. What's the focal point?","Based on your 3 words, what might the artist be trying to say? Does the context confirm it?"]}},"AXES_BY_LEVEL":{"Tous niveaux":["Tous les axes"],"6e":["Tous les axes","Personnes et personnages","Le quotidien : vivre, jouer, apprendre","Pays et paysages","Imaginaire, contes et légendes","Arts et expression des sentiments"],"5e":["Tous les axes","Portrait, autoportrait","Le quotidien : lieux, rythmes, saisons","Le réel et l'imaginaire","École et loisirs","Des langues, des lieux, des histoires","Le Royaume-Uni"],"4e":["Tous les axes","Sport et société","Voyages et explorations","Villes, villages, quartiers","Inventer, innover, créer","Langages et messages artistiques","L'Irlande"],"3e":["Tous les axes","À la rencontre de l'autre","Travailler hier, aujourd'hui, demain","Voyages et migrations","Langages et médias","Formes de l'engagement","Les États-Unis"],"2de":["Tous les axes","Représentation de soi et rapport à autrui","Vivre entre générations","Le passé dans le présent","Défis et transitions","Créer et recréer","Les pays du Commonwealth"],"1re":["Tous les axes","Identités et échanges","Diversité et inclusion","Art et pouvoir","Innovations scientifiques et responsabilité","L'être humain et la nature","Les aires anglophones américaines"],"Terminale":["Tous les axes","Espace privé et espace public","Territoire et mémoire","Fictions et réalités","Enjeux et formes de la communication","Citoyenneté et mondes virtuels","Le Royaume-Uni et ses nations"]},"DIFF":{"A1":"Étayage sur l'étape 2 : fournir directement les mots-clés à repérer au lieu de les faire chercher. Enrichissement : demander un 4e mot non donné par le professeur.","A2":"Étayage sur l'étape 1 : donner 2 hypothèses possibles à choisir plutôt qu'à formuler. Enrichissement : demander une justification écrite de l'hypothèse retenue.","B1":"Étayage sur l'étape 2 : grille de repérage partiellement complétée. Enrichissement : ajouter une étape de comparaison avec une hypothèse de départ d'un autre groupe.","B2":"Étayage sur l'étape 3 : fournir des connecteurs logiques à mobiliser obligatoirement. Enrichissement : exiger un contre-argument dans la production finale.","C1":"Enrichissement : remplacer l'étape 3 par une analyse comparative avec une autre ressource du même axe, ou un débat avec rôles assignés à défendre."}}}</script>

<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('cc-data').textContent);
var META = JSON.parse(document.getElementById('cc-meta').textContent);
var RES = DATA.res, TPL = DATA.tpl, TYPES = META.types, COUNTRIES = META.countries;
var AXES = TPL.AXES_BY_LEVEL;
var CLASSES = ['6e', '5e', '4e', '3e', '2de', '1re', 'Terminale'];
var TYPE_ORDER = ['music', 'film', 'series', 'podcast', 'press', 'art'];
var KEY = 'cc_v2', CKEY = 'cc_custom';
var ST, CUSTOM = [], ALL = [], BYID = {};
var view = 'home', shown = 24, detailId = null, prevFocus = null;
var F = { q: '', type: '', country: '', klass: '', axe: '', cecrl: '', lvl: 0 };

/* ---------- utils ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').toLowerCase().normalize ? String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') : String(s || '').toLowerCase(); }
function has(a, v) { return a.indexOf(v) > -1; }
function keys(o) { var k = [], x; for (x in o) if (o.hasOwnProperty(x)) k.push(x); return k; }
function shuffleArr(a) { a = a.slice(0); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function flag(c, cls) { return '<span class="flag' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + esc(c) + '</span>'; }
function cname(c) { return COUNTRIES[c] ? COUNTRIES[c].name : 'Monde anglophone'; }
function tmeta(t) { return TYPES[t] || TYPES.press; }
function plural(n, a, b) { return n + ' ' + (n > 1 ? b : a); }

function lvlOf(df) {
  var d = String(df || 'B1').toUpperCase().replace(/\s/g, '');
  if (d === 'A1' || d === 'A1-A2' || d === 'A2') return 1;
  if (d.indexOf('A2-B') === 0) return 2;
  if (d === 'B1' || d === 'B1-B2') return 3;
  if (d.indexOf('C1') > -1 && d.indexOf('B') < 0) return 5;
  if (d.indexOf('C2') > -1) return 5;
  if (d.indexOf('B2') > -1 || d.indexOf('C1') > -1) return 4;
  return 3;
}
function cecrlBand(df) { var d = String(df || 'B1').toUpperCase(); if (d.indexOf('A1') > -1 || d.indexOf('A2') > -1) return 'A1-A2'; if (d.indexOf('C1') > -1 || d.indexOf('C2') > -1) return 'C1-C2'; return 'B1-B2'; }
function lvlPill(r) { var k = lvlOf(r.df), L = META.levels[k - 1]; return '<span class="pill lv' + k + '" title="Niveau CECRL ' + esc(r.df) + '">' + L.icon + ' ' + L.label + '</span>'; }
function hostOf(u) { var m = String(u || '').match(/^https?:\/\/([^\/]+)/); return m ? m[1].replace(/^www\./, '') : ''; }
function cleanTitle(t) { return String(t || '').replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
function findUrl(r) {
  var q = encodeURIComponent(cleanTitle(r.t));
  if (r.ty === 'film' || r.ty === 'music' || r.ty === 'series') return 'https://www.youtube.com/results?search_query=' + q;
  if (hostOf(r.u).indexOf('bbc.co.uk') > -1) return 'https://www.bbc.co.uk/search?q=' + encodeURIComponent(cleanTitle(r.t).split(/ [—–-] /)[0]);
  return 'https://duckduckgo.com/?q=' + q;
}
function openLabel(r) { return { music: '▶ Écouter', film: '▶ Regarder', series: '▶ Regarder', podcast: '▶ Écouter', press: '📖 Lire', art: '👀 Voir l\'œuvre' }[r.ty] || '↗ Ouvrir'; }

/* ---------- storage ---------- */
function load() {
  try { ST = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { ST = {}; }
  if (!ST.disc || typeof ST.disc !== 'object') ST.disc = {};
  if (!(ST.favs instanceof Array)) ST.favs = [];
  if (!ST.cycle) ST.cycle = 'all';
  if (!ST.tview) ST.tview = 'list';
  if (!(ST.badges instanceof Array)) ST.badges = [];
  try { var c = JSON.parse(localStorage.getItem(CKEY) || '[]'); CUSTOM = c instanceof Array ? c : []; } catch (e) { CUSTOM = []; }
  CUSTOM = CUSTOM.map(fromCustom).filter(function (r) { return r && r.t; });
  rebuild();
}
function fromCustom(r) {
  if (!r) return null;
  if (r.t) return r;
  return { i: r.id, t: r.title, ty: r.type, ax: r.axe, lv: r.level, c: r.country, y: r.year, u: r.url, d: r.desc, tg: r.tags || [], df: r.difficulty || 'B1', g: 0, mine: 1 };
}
function rebuild() { ALL = RES.concat(CUSTOM.map(function (r) { r.mine = 1; return r; })); BYID = {}; for (var k = 0; k < ALL.length; k++) BYID[ALL[k].i] = ALL[k]; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
function saveCustom() { try { localStorage.setItem(CKEY, JSON.stringify(CUSTOM)); } catch (e) {} rebuild(); }
function isT() { return ST.mode === 'teacher'; }

/* ---------- pools & filters ---------- */
function cycleOk(r) { if (isT() || ST.cycle === 'all') return true; return r.lv === ST.cycle || r.lv === 'Tous niveaux'; }
var ORDER = null;
function basePool() {
  var out = [], seen = {}, k, r, key;
  if (!ORDER || ORDER.length !== ALL.length) ORDER = shuffleArr(ALL);
  var src = isT() ? ALL : ORDER;
  for (k = 0; k < src.length; k++) {
    r = src[k]; if (!cycleOk(r)) continue;
    if (!isT()) { key = norm(r.t); if (seen[key]) continue; seen[key] = 1; }
    out.push(r);
  }
  return out;
}
function matches(r) {
  if (F.type && r.ty !== F.type) return false;
  if (F.country && r.c !== F.country) return false;
  if (isT()) {
    if (F.klass) { var ax = AXES[F.klass] || []; if (!has(ax, r.ax)) return false; }
    if (F.axe && r.ax !== F.axe) return false;
    if (F.cecrl && cecrlBand(r.df) !== F.cecrl) return false;
  } else if (F.lvl) {
    var l = lvlOf(r.df);
    if (F.lvl === 1 && l > 2) return false;
    if (F.lvl === 3 && l !== 3) return false;
    if (F.lvl === 4 && l < 4) return false;
  }
  if (F.q) {
    var q = norm(F.q), hay = norm(r.t + ' ' + r.d + ' ' + (r.tg || []).join(' ') + ' ' + cname(r.c) + ' ' + (COUNTRIES[r.c] ? COUNTRIES[r.c].en : '') + ' ' + r.ax + ' ' + r.y);
    var words = q.split(/\s+/);
    for (var w = 0; w < words.length; w++) if (words[w] && hay.indexOf(words[w]) < 0) return false;
  }
  return true;
}
function filtered() { var p = basePool(), out = []; for (var k = 0; k < p.length; k++) if (matches(p[k])) out.push(p[k]); return out; }
function countBy(pool, field) { var m = {}; for (var k = 0; k < pool.length; k++) m[pool[k][field]] = (m[pool[k][field]] || 0) + 1; return m; }
function dailyPick() {
  var p = ALL.filter(function (r) { return cycleOk(r) && !r.mine && r.ty !== 'press'; }); if (!p.length) return null;
  var d = new Date(), seed = d.getFullYear() * 1000 + Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  var x = Math.sin(seed * 9301 + 49297) * 233280; x = x - Math.floor(x);
  return p[Math.floor(x * p.length)];
}

/* ---------- discoveries & badges ---------- */
function discList() { var out = [], k; for (k in ST.disc) if (ST.disc.hasOwnProperty(k) && BYID[k]) out.push(BYID[k]); return out; }
function discStats() {
  var L = discList(), c = {}, t = {}, k;
  for (k = 0; k < L.length; k++) { c[L[k].c] = (c[L[k].c] || 0) + 1; t[L[k].ty] = (t[L[k].ty] || 0) + 1; }
  return { total: L.length, countries: c, types: t, nCountries: keys(c).length, nTypes: keys(t).length };
}
function badgeProgress(b, s) {
  if (b.kind === 'total') return s.total;
  if (b.kind === 'countries') return s.nCountries;
  if (b.kind === 'types') return s.nTypes;
  if (b.kind === 'type') return s.types[b.id] || 0;
  return 0;
}
function checkBadges() {
  var s = discStats(), got = [];
  for (var k = 0; k < META.badges.length; k++) { var b = META.badges[k]; if (!has(ST.badges, b.id) && badgeProgress(b, s) >= b.need) { ST.badges.push(b.id); got.push(b); } }
  return got;
}
function discover(r, silent) {
  if (!r || ST.disc[r.i]) return;
  ST.disc[r.i] = new Date().toISOString().slice(0, 10);
  var got = checkBadges(); save();
  if (!silent) stampFx(r, got);
  renderTop();
}

/* ---------- small UI ---------- */
var toastT = null;
function toast(m) { var t = $('toast'); t.textContent = m; t.className = 'toast'; if (toastT) clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast hidden'; }, 2600); }
function stampFx(r, got) {
  $('fx').innerHTML = '<div class="stampfx"><div>' + flag(r.c) + 'Tampon ' + esc(cname(r.c)) + ' !</div></div>';
  setTimeout(function () { $('fx').innerHTML = ''; if (got && got.length) toast(got[0].icon + ' Nouveau badge : ' + got[0].name + ' !'); }, 1300);
}

/* ---------- top bar ---------- */
function renderTop() {
  var nFav = ST.favs.length, s = discStats();
  var nav = [['home', '🏠', 'Accueil', ''], ['explore', '🧭', 'Explorer', '']];
  if (!isT()) nav.push(['passport', '🛂', 'Passeport', s.total ? '<span class="count">' + s.total + '</span>' : '']);
  nav.push(['favs', isT() ? '📌' : '❤️', isT() ? 'Ma sélection' : 'Coups de cœur', nFav ? '<span class="count">' + nFav + '</span>' : '']);
  var h = '<button class="logo" data-act="go" data-arg="home" aria-label="Culture Corner, accueil"><span class="globe" aria-hidden="true">🌍</span>Culture<b>Corner</b></button><nav class="nav" aria-label="Navigation">';
  for (var k = 0; k < nav.length; k++) h += '<button class="' + (view === nav[k][0] ? 'on' : '') + '" data-act="go" data-arg="' + nav[k][0] + '"' + (view === nav[k][0] ? ' aria-current="page"' : '') + '><span class="ni" aria-hidden="true">' + nav[k][1] + '</span><span class="nt">' + nav[k][2] + nav[k][3] + '</span></button>';
  h += '</nav><div class="modeswitch" role="group" aria-label="Mode"><button class="' + (!isT() ? 'on' : '') + '" data-act="mode" data-arg="student">🎒 Élève</button><button class="' + (isT() ? 'on' : '') + '" data-act="mode" data-arg="teacher">🧑‍🏫 Prof</button></div>';
  $('topbar').innerHTML = h;
}

/* ---------- cards ---------- */
function cardHtml(r) {
  var tm = tmeta(r.ty), fav = has(ST.favs, r.i), done = !!ST.disc[r.i];
  return '<article class="card" data-act="open" data-arg="' + r.i + '" tabindex="0" role="button" aria-label="' + esc(r.t + ' — ' + tm.label + ', ' + cname(r.c)) + '"><button class="heart' + (fav ? ' on' : '') + '" data-act="fav" data-arg="' + r.i + '" aria-label="' + (fav ? 'Retirer des favoris' : 'Ajouter aux favoris') + '" aria-pressed="' + fav + '">' + (fav ? '❤️' : '🤍') + '</button>' +
    '<div style="display:flex;flex-direction:column;flex:1">' +
    '<div class="band" style="background:' + tm.color + '"><span class="ic" aria-hidden="true">' + tm.icon + '</span><span class="lab">' + esc(tm.label) + '</span><span class="stamp" title="' + esc(cname(r.c)) + '">' + flag(r.c) + '</span></div>' +
    '<div class="body"><h3>' + esc(r.t) + '</h3><p>' + esc(r.d) + '</p><div class="meta">' + lvlPill(r) + '<span class="pill">' + esc(cname(r.c)) + (r.y ? ' · ' + r.y : '') + '</span>' + (done && !isT() ? '<span class="pill done">✓ Découvert</span>' : '') + (r.mine ? '<span class="pill" style="background:#E8F0FF;color:#1E4FD8">Ajoutée par toi</span>' : '') + '</div></div></div></article>';
}
function rowHtml(r) {
  var tm = tmeta(r.ty), fav = has(ST.favs, r.i);
  return '<div class="trow" style="border-left-color:' + tm.color + '"><span class="ic" aria-hidden="true">' + tm.icon + '</span><button data-act="open" data-arg="' + r.i + '" style="all:unset;cursor:pointer;flex:1;min-width:0" class="tt"><b>' + esc(r.t) + '</b><small>' + flag(r.c) + ' ' + esc(cname(r.c)) + ' · ' + esc(r.ax) + ' · ' + esc(r.df) + (r.g ? ' · 🔎 lien général' : '') + '</small></button>' + lvlPill(r) + '<button class="heart' + (fav ? ' on' : '') + '" style="position:static" data-act="fav" data-arg="' + r.i + '" aria-label="' + (fav ? 'Retirer de ma sélection' : 'Ajouter à ma sélection') + '">' + (fav ? '📌' : '➕') + '</button></div>';

  h += '<div class="stats"><div class="stat"><b>' + s.total + '</b>découverte' + (s.total > 1 ? 's' : '') + '</div><div class="stat"><b>' + s.nCountries + ' / ' + keys(COUNTRIES).length + '</b>pays</div><div class="stat"><b>' + s.nTypes + ' / 6</b>types de documents</div><div class="stat"><b>' + ST.badges.length + ' / ' + META.badges.length + '</b>badges</div></div><div class="pgrid">';
  var cs = keys(COUNTRIES);
  for (k = 0; k < cs.length; k++) { var n = s.countries[cs[k]] || 0; h += '<button class="pst' + (n ? ' on' : '') + '" data-act="quickCountry" data-arg="' + esc(cs[k]) + '" style="font:inherit;cursor:pointer">' + flag(cs[k]) + '<b>' + esc(COUNTRIES[cs[k]].name) + '</b><small>' + (n ? plural(n, 'tampon', 'tampons') : 'pas encore visité') + '</small></button>'; }
  h += '</div></div></section><section class="sec"><h2>🏅 Mes badges</h2><p class="sub">Continue à explorer pour tous les débloquer.</p><div class="badges">';
  for (k = 0; k < META.badges.length; k++) { var b = META.badges[k], p = badgeProgress(b, s), got = has(ST.badges, b.id) || p >= b.need; h += '<div class="badge' + (got ? '' : ' off') + '"><span class="ic">' + b.icon + '</span><b>' + esc(b.name) + '</b><small>' + esc(b.desc) + '</small>' + (got ? '' : '<div class="bar" aria-hidden="true"><span style="width:' + Math.round(Math.min(p, b.need) / b.need * 100) + '%"></span></div><small>' + Math.min(p, b.need) + ' / ' + b.need + '</small>') + '</div>'; }
  h += '</div></section>';
  var L = discList().sort(function (a, b) { return ST.disc[b.i] > ST.disc[a.i] ? 1 : -1; });
  h += '<section class="sec"><h2>🗂️ Mes découvertes</h2>';
  h += L.length ? cardsHtml(L) : '<div class="empty"><div class="big">🧳</div><h3>Ton passeport est encore vide</h3><p style="color:var(--soft)">Ouvre une ressource : tu gagnes le tampon de son pays.</p><button class="btn btn-sun" data-act="surprise">🎲 Surprends-moi !</button></div>';
  h += '</section></div>';
  $('app').innerHTML = h;
}

/* ---------- FAVS ---------- */
function favs() {
  var L = ST.favs.map(function (id) { return BYID[id]; }).filter(Boolean), h = '<div class="wrap"><section class="sec"><h2>' + (isT() ? '📌 Ma sélection' : '❤️ Mes coups de cœur') + '</h2><p class="sub">' + (isT() ? 'Prépare ta séquence : garde ici les documents retenus, puis imprime la liste ou les fiches.' : 'Les ressources que tu as aimées, pour les retrouver facilement.') + '</p>';
  if (isT() && L.length) h += '<div class="actions"><button class="btn btn-ink btn-sm" data-act="printSel">🖨️ Imprimer la liste</button><button class="btn btn-ghost btn-sm" data-act="printSelFiches">🖨️ Imprimer avec les fiches</button><button class="btn btn-ghost btn-sm" data-act="copySel">📋 Copier les liens</button><button class="btn btn-ghost btn-sm" data-act="clearSel">Vider la sélection</button></div>';
  h += L.length ? cardsHtml(L) : '<div class="empty"><div class="big">' + (isT() ? '📌' : '🤍') + '</div><h3>' + (isT() ? 'Ta sélection est vide' : 'Pas encore de coup de cœur') + '</h3><p style="color:var(--soft)">' + (isT() ? 'Clique sur ➕ à côté d\'une ressource pour l\'ajouter.' : 'Clique sur le cœur 🤍 d\'une carte pour la garder ici.') + '</p><button class="btn btn-ink btn-sm" data-act="go" data-arg="explore">🧭 Explorer</button></div>';
  if (isT()) h += '<section class="sec"><h2>➕ Mes ressources personnelles</h2><p class="sub">' + plural(CUSTOM.length, 'ressource ajoutée', 'ressources ajoutées') + ' par toi, enregistrées sur cet appareil.</p><div class="actions"><button class="btn btn-ink btn-sm" data-act="add">＋ Ajouter une ressource</button><button class="btn btn-ghost btn-sm" data-act="exportCustom"' + (CUSTOM.length ? '' : ' disabled') + '>⬇ Exporter</button><label class="btn btn-ghost btn-sm" style="cursor:pointer">⬆ Importer<input type="file" accept=".json,application/json" data-change="importCustom" style="display:none"></label></div>' + (CUSTOM.length ? cardsHtml(CUSTOM) : '') + '</section>';
  h += '</section></div>';
  $('app').innerHTML = h;
}

/* ---------- add resource ---------- */
function addModal(err, v) {
  v = v || { t: '', ty: 'music', ax: allAxes()[0], lv: 'Collège', c: '🇬🇧', y: new Date().getFullYear(), u: '', d: '', df: 'B1', tg: '' };
  var k, h = '<div class="mback" data-act="closeBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="aTitle"><div class="mhead" style="background:#1B2A4A"><button class="close" data-act="close" aria-label="Fermer">✕</button><h2 id="aTitle">Ajouter une ressource</h2></div><div class="mbody form">';
  h += '<label for="fT">Titre *</label><input id="fT" value="' + esc(v.t) + '" placeholder="Ex. BBC News – Climate Change Special">';
  h += '<div class="two"><div><label for="fTy">Type *</label><select id="fTy">'; for (k = 0; k < TYPE_ORDER.length; k++) h += '<option value="' + TYPE_ORDER[k] + '"' + (v.ty === TYPE_ORDER[k] ? ' selected' : '') + '>' + TYPES[TYPE_ORDER[k]].icon + ' ' + TYPES[TYPE_ORDER[k]].label + '</option>';
  h += '</select></div><div><label for="fLv">Cycle *</label><select id="fLv">'; var lvs = ['Collège', 'Lycée', 'Tous niveaux']; for (k = 0; k < lvs.length; k++) h += '<option' + (v.lv === lvs[k] ? ' selected' : '') + '>' + lvs[k] + '</option>';
  h += '</select></div></div><label for="fAx">Axe du programme *</label><select id="fAx">'; var axs = allAxes(); for (k = 0; k < axs.length; k++) h += '<option' + (v.ax === axs[k] ? ' selected' : '') + '>' + esc(axs[k]) + '</option>';
  h += '</select><div class="two"><div><label for="fC">Pays</label><select id="fC">'; var cs = keys(COUNTRIES); for (k = 0; k < cs.length; k++) h += '<option value="' + cs[k] + '"' + (v.c === cs[k] ? ' selected' : '') + '>' + esc(COUNTRIES[cs[k]].name) + '</option>';
  h += '</select></div><div><label for="fDf">Niveau CECRL</label><select id="fDf">'; var dfs = ['A1', 'A1-A2', 'A2-B1', 'B1', 'B1-B2', 'B2', 'B2-C1', 'C1']; for (k = 0; k < dfs.length; k++) h += '<option' + (v.df === dfs[k] ? ' selected' : '') + '>' + dfs[k] + '</option>';
  h += '</select></div></div><div class="two"><div><label for="fY">Année</label><input id="fY" type="number" value="' + esc(v.y) + '"></div><div><label for="fU">Lien *</label><input id="fU" type="url" value="' + esc(v.u) + '" placeholder="https://…"></div></div>';
  h += '<label for="fD">Description *</label><textarea id="fD" placeholder="Décris la ressource et son intérêt pour la classe…">' + esc(v.d) + '</textarea><label for="fTg">Mots-clés (séparés par des virgules)</label><input id="fTg" value="' + esc(v.tg) + '" placeholder="identity, protest, music…">';
  if (err) h += '<p class="err">⚠ ' + esc(err) + '</p>';
  h += '<div class="actions"><button class="btn btn-pop" data-act="saveCustom">Ajouter la ressource</button></div></div></div></div>';
  $('modalRoot').innerHTML = h;
  $('fT').focus();
}
function saveCustomForm() {
  function val(id) { return String($(id).value || '').replace(/^\s+|\s+$/g, ''); }
  var v = { t: val('fT'), ty: val('fTy'), ax: val('fAx'), lv: val('fLv'), c: val('fC'), y: parseInt(val('fY'), 10) || new Date().getFullYear(), u: val('fU'), d: val('fD'), df: val('fDf'), tg: val('fTg') };
  if (!v.t) return addModal('Le titre est obligatoire.', v);
  if (!/^https?:\/\//.test(v.u)) return addModal('Le lien doit commencer par http:// ou https://.', v);
  if (!v.d) return addModal('La description est obligatoire.', v);
  CUSTOM.push({ i: 'c' + new Date().getTime(), t: v.t, ty: v.ty, ax: v.ax, lv: v.lv, c: v.c, y: v.y, u: v.u, d: v.d, df: v.df, tg: v.tg.split(',').map(function (x) { return x.replace(/^\s+|\s+$/g, ''); }).filter(Boolean), g: 0, mine: 1 });
  saveCustom(); closeDetail(); toast('Ressource ajoutée ✓'); render();
}

/* ---------- routing ---------- */
function go(v) { view = v; shown = 24; closeDetail(); render(); window.scrollTo(0, 0); }
function render() {
  document.body.className = ST.dys ? 'dys' : '';
  renderTop();
  if (view === 'explore') explore();
  else if (view === 'passport' && !isT()) passport();
  else if (view === 'favs') favs();
  else { view = 'home'; home(); }
}
function surprise(pool) {
  pool = pool || basePool(); if (!pool.length) { toast('Aucune ressource à tirer au sort ici.'); return; }
  openDetail(pool[Math.floor(Math.random() * pool.length)].i);
}

/* ---------- actions ---------- */
var ACT = {
  go: function (a) { go(a); },
  mode: function (a) { ST.mode = a; save(); F.klass = F.axe = F.cecrl = ''; F.lvl = 0; if (view === 'passport' && a === 'teacher') view = 'home'; render(); toast(a === 'teacher' ? 'Mode prof : fiches d\'exploitation et sélection' : 'Mode élève : à toi de découvrir !'); },
  cycle: function (a) { ST.cycle = a; save(); render(); },
  surprise: function () { surprise(); },
  surpriseHere: function () { surprise(filtered()); },
  quick: function () { F.klass = $('qkClass').value; F.axe = $('qkAxe').value; F.type = F.country = F.q = ''; go('explore'); },
  quickType: function (a) { F.type = a; F.country = ''; F.q = ''; go('explore'); },
  quickCountry: function (a) { F.country = a; F.type = ''; F.q = ''; go('explore'); },
  chip: function (a) { var p = a.split('|'); F[p[0]] = F[p[0]] === p[1] ? '' : p[1]; if (p[1] === '') F[p[0]] = ''; shown = 24; explore(); },
  reset: function () { F = { q: '', type: '', country: '', klass: '', axe: '', cecrl: '', lvl: 0 }; shown = 24; explore(); },
  more: function () { shown += 24; results(); },
  tview: function (a) { ST.tview = a; save(); results(); },
  open: function (a) { openDetail(isNaN(+a) ? a : +a); },
  close: function () { closeDetail(); },
  closeBack: function (a, el, e) { if (e.target === el) closeDetail(); },
  openLink: function (a) { var r = BYID[isNaN(+a) ? a : +a]; if (r && !isT()) { discover(r); openDetailKeep(r.i); } },
  toggleDisc: function (a) { var id = isNaN(+a) ? a : +a, r = BYID[id]; if (!r) return; if (ST.disc[id]) { delete ST.disc[id]; save(); renderTop(); openDetail(id); } else { discover(r); openDetail(id); } refreshBehind(); },
  fav: function (a) {
    var id = isNaN(+a) ? a : +a, i = ST.favs.indexOf(id);
    if (i > -1) ST.favs.splice(i, 1); else ST.favs.push(id);
    save(); renderTop(); toast(i > -1 ? (isT() ? 'Retiré de ta sélection' : 'Retiré de tes coups de cœur') : (isT() ? 'Ajouté à ta sélection 📌' : 'Ajouté à tes coups de cœur ❤️'));
    if (detailId !== null) openDetail(detailId);
    refreshBehind();
  },
  printFiche: function (a) { var r = BYID[isNaN(+a) ? a : +a]; if (r) printHtml('<h1>Culture Corner · fiche d\'exploitation</h1>' + ficheText(r)); },
  printSel: function () { var L = ST.favs.map(function (id) { return BYID[id]; }).filter(Boolean), h = '<h1>Ma sélection · Culture Corner</h1>'; for (var k = 0; k < L.length; k++) { var r = L[k]; h += '<div class="pi"><b>' + esc(r.t) + '</b> — ' + esc(tmeta(r.ty).label) + ' · ' + esc(cname(r.c)) + ' · ' + esc(r.ax) + ' · CECRL ' + esc(r.df) + '<br>' + esc(r.d) + '<br>' + esc(r.g ? findUrl(r) : r.u) + '</div>'; } printHtml(h); },
  printSelFiches: function () { var L = ST.favs.map(function (id) { return BYID[id]; }).filter(Boolean), h = '<h1>Ma sélection · fiches d\'exploitation</h1>'; for (var k = 0; k < L.length; k++) h += '<div class="pi" style="page-break-inside:avoid">' + ficheText(L[k]) + '</div>'; printHtml(h); },
  copySel: function () { var L = ST.favs.map(function (id) { return BYID[id]; }).filter(Boolean), txt = L.map(function (r) { return r.t + ' — ' + (r.g ? findUrl(r) : r.u); }).join('\n'); copy(txt); },
  clearSel: function () { confirmBox('Vider la sélection ?', 'Toutes les ressources retenues seront retirées de ta sélection.', 'Vider', function () { ST.favs = []; save(); render(); }); },
  confirmOk: function () { var f = pendingConfirm; pendingConfirm = null; closeDetail(); if (f) f(); },
  add: function () { addModal(); },
  saveCustom: function () { saveCustomForm(); },
  delCustom: function (a) { confirmBox('Supprimer cette ressource ?', 'Elle sera effacée de cet appareil.', 'Supprimer', function () { CUSTOM = CUSTOM.filter(function (r) { return String(r.i) !== String(a); }); ST.favs = ST.favs.filter(function (x) { return String(x) !== String(a); }); save(); saveCustom(); render(); }); },
  exportCustom: function () { var b = new Blob([JSON.stringify({ app: 'CultureCorner', version: 2, resources: CUSTOM }, null, 2)], { type: 'application/json' }), x = document.createElement('a'); x.href = URL.createObjectURL(b); x.download = 'culturecorner-mes-ressources.json'; document.body.appendChild(x); x.click(); document.body.removeChild(x); }
};
function openDetailKeep(id) { setTimeout(function () { if (detailId === id) openDetail(id); refreshBehind(); }, 50); }
function refreshBehind() { if (view === 'explore' && $('results')) results(); else if (view === 'favs') favs(); else if (view === 'passport') passport(); }
function copy(txt) {
  function fb() { var t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Liens copiés ✓'); } catch (e) { toast('Copie impossible ici'); } document.body.removeChild(t); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Liens copiés ✓'); }, fb); else fb();
}
function findAct(el) { while (el && el !== document) { if (el.getAttribute && el.getAttribute('data-act')) return el; el = el.parentNode; } return null; }
document.addEventListener('click', function (e) {
  var el = findAct(e.target); if (!el) return;
  var a = el.getAttribute('data-act');
  if (a !== 'openLink' && el.tagName === 'A') return;
  if (ACT[a]) { if (el.tagName !== 'A') e.preventDefault(); ACT[a](el.getAttribute('data-arg'), el, e); }
});
var qTimer = null;
document.addEventListener('input', function (e) {
  if (e.target.getAttribute('data-in') === 'q') { F.q = e.target.value; shown = 24; if (qTimer) clearTimeout(qTimer); qTimer = setTimeout(results, 160); }
});
document.addEventListener('change', function (e) {
  var k = e.target.getAttribute('data-change'); if (!k) return;
  var v = e.target.value;
  if (k === 'qkClass') { F.klass = v; F.axe = ''; $('qkAxe').innerHTML = axeOptions(v, ''); return; }
  if (k === 'klass') { F.klass = v; F.axe = ''; }
  else if (k === 'axe') F.axe = v;
  else if (k === 'cecrl') F.cecrl = v;
  else if (k === 'lvl') F.lvl = parseInt(v, 10) || 0;
  else if (k === 'cycle') { ST.cycle = v; save(); }
  else if (k === 'importCustom') {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { try { var o = JSON.parse(rd.result), list = o.resources || o; if (!(list instanceof Array)) throw 0; var n = 0; list.forEach(function (r) { r = fromCustom(r); if (r && r.t && r.u) { r.i = 'c' + new Date().getTime() + '_' + (n++); r.mine = 1; CUSTOM.push(r); } }); saveCustom(); render(); toast(n + ' ressource(s) importée(s)'); } catch (err) { toast('Fichier non reconnu'); } };
    rd.readAsText(f); return;
  }
  shown = 24; explore();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('modalRoot').innerHTML) closeDetail();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.tagName === 'ARTICLE') { e.preventDefault(); e.target.click(); }
});

load();
if (!ST.mode) ST.mode = 'student';
render();
})();

</script>
</body>
</html>
